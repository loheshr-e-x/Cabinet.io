[package]
name = "cabinet-edge-daemon"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
webrtc = "0.8"
lz4 = "1.24"
redis = { version = "0.24", features = ["tokio-comp"] }
aws-sdk-s3 = { version = "1.152.0", features = ["behavior-version-latest"] }
rust-libretro-sys = "0.3.2"  # Ensure it uses the explicit updated crate name
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
