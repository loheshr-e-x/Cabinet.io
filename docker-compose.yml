version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: cabinet_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: cabinet
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./apps/orchestrator/src/db/schema.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:7-alpine
    container_name: cabinet_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  pgdata: